name: Unittests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}, sdist
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install from sdist
        shell: bash
        run: |
          pipx run build --sdist .
          source_file=$(ls ./dist/*.tar.gz)
          pip install opencv-python-headless
          pip install "${source_file}[tests]"

      - name: Run test cases numpy latest
        working-directory: ./tests
        run: |
          pytest --cov=faster_coco_eval .

  optional-dependency-tests:
    name: Optional dependency tests (ubuntu-latest, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install optional test dependencies from sdist
        shell: bash
        run: |
          pipx run build --sdist .
          source_file=$(python -c "import glob,sys; files=glob.glob('dist/*.tar.gz'); (len(files)==1) or sys.exit(f'Expected 1 sdist in dist/, found {len(files)}: {files}'); print(files[0])")
          python -m pip install "${source_file}[tests,extra]"
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torchmetrics lightning-utilities
          python -m pip check

      - name: Assert optional test modules import (no SkipTest)
        shell: bash
        working-directory: ./tests
        run: |
          set -euo pipefail
          for test_file in test_torchmetrics.py test_world_evaluator.py test_extra_draw.py; do
            python -c "import runpy; runpy.run_path('${test_file}')"
          done

      - name: Run optional dependency tests
        working-directory: ./tests
        run: |
          python -m pytest -q test_torchmetrics.py test_world_evaluator.py test_extra_draw.py

  free-threaded:
    name: Free-threaded CPython ${{ matrix.python-version }} (no-GIL)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Assert free-threaded interpreter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import sysconfig

          if str(sysconfig.get_config_var("Py_GIL_DISABLED")) != "1":
              raise SystemExit("Python build does not support free-threading")
          if sys._is_gil_enabled():
              raise SystemExit("GIL is enabled before extension imports")
          PY

      - name: Install from sdist
        shell: bash
        run: |
          set -euo pipefail
          pipx run build --sdist .
          source_file=$(python -c "import glob,sys; files=glob.glob('dist/*.tar.gz'); (len(files)==1) or sys.exit(f'Expected 1 sdist in dist/, found {len(files)}: {files}'); print(files[0])")
          python -m pip install "${source_file}[tests]"

      - name: Import extensions without re-enabling the GIL
        shell: bash
        working-directory: ./tests
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          import os
          import sys
          import warnings
          from pathlib import Path

          with warnings.catch_warnings():
              warnings.simplefilter("error")
              modules = (
                  importlib.import_module("faster_coco_eval.faster_eval_api_cpp"),
                  importlib.import_module("faster_coco_eval.mask_api_new_cpp"),
              )
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in modules:
              if Path(module.__file__).resolve().is_relative_to(workspace):
                  raise SystemExit(f"import resolved from checkout: {module.__file__}")
          if sys._is_gil_enabled():
              raise SystemExit("an extension import re-enabled the GIL")
          PY

      - name: Run synchronized native stress regressions
        working-directory: ./tests
        run: python -m pytest -q test_cpp_safety_regressions.py -k "TestDatasetConcurrency"
