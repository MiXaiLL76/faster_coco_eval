name: Build and Publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test_source:
    uses: ./.github/workflows/unittest.yml

  build_wheels:
    needs: test_source
    name: Build wheels on ${{ matrix.os }}-${{ matrix.cibw_archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest # linux x86_64
            cibw_archs: x86_64
            cibw_skip: "pp* *musllinux*"
          - os: ubuntu-latest # linux arm64 gnu
            cibw_archs: aarch64
            cibw_skip: "pp* *musllinux*"
          - os: windows-latest
            cibw_archs: AMD64
            cibw_skip: "pp*"
            cibw_repair_command: "delvewheel repair -w {dest_dir} -v {wheel}"
          - os: windows-latest
            cibw_archs: ARM64
            cibw_skip: "pp*"
            # cross-compiled on an x86_64 runner: delvewheel can't locate the
            # ARM64 msvcp140.dll (only the x64 copy is on PATH), so exclude it
            # from bundling instead of failing the repair step.
            cibw_repair_command: "delvewheel repair --exclude msvcp140.dll -w {dest_dir} -v {wheel}"
          - os: macos-14
            cibw_archs: arm64
            cibw_skip: "pp*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        if: runner.os == 'Linux' && matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update --fix-missing
          sudo apt install -y libtiff5-dev libjpeg8-dev libopenjp2-7-dev zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk libharfbuzz-dev libfribidi-dev libxcb1-dev

      - name: Setup macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install gcc libomp

      - name: Build wheels for ${{ matrix.os }}
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
          CIBW_PRERELEASE_PYTHONS: "false"
          CIBW_BUILD_FRONTEND: build
          CIBW_SKIP: ${{ matrix.cibw_skip }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_TEST_REQUIRES: "pytest parameterized"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          CIBW_TEST_SKIP: "*-win_arm64"
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ${{ matrix.cibw_repair_command }}
        with:
          package-dir: ./

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faster-coco-eval-${{ matrix.os }}-${{ matrix.cibw_archs }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: test_source
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        run: make sdist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faster-coco-eval-sdist
          path: ./dist/*.tar.gz

  publish_test:
    needs: [build_wheels, build_sdist]
    name: Publish package to TestPyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  publish_prod:
    needs: [publish_test]
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docs:
    needs: [publish_prod]
    uses: ./.github/workflows/docs.yml
