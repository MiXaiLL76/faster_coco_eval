name: Build and Publish

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test_source:
    uses: ./.github/workflows/unittest.yml

  build_wheels:
    needs: test_source
    name: Build wheels on ${{ matrix.os }}-${{ matrix.cibw_archs }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest # linux x86_64
            cibw_archs: x86_64
            cibw_skip: "pp* *musllinux*"
          - os: ubuntu-latest # linux arm64 gnu
            cibw_archs: aarch64
            cibw_skip: "pp* *musllinux*"
          - os: windows-latest
            cibw_archs: AMD64
            cibw_skip: "pp*"
          - os: windows-latest
            cibw_archs: ARM64
            cibw_skip: "pp*"
          - os: macos-14
            cibw_archs: arm64
            cibw_skip: "pp*"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup QEMU
        if: runner.os == 'Linux' && matrix.cibw_archs == 'aarch64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update --fix-missing
          sudo apt install -y libtiff5-dev libjpeg8-dev libopenjp2-7-dev zlib1g-dev libfreetype6-dev liblcms2-dev libwebp-dev tcl8.6-dev tk8.6-dev python3-tk libharfbuzz-dev libfribidi-dev libxcb1-dev

      - name: Setup macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install gcc libomp

      - name: Build wheels for ${{ matrix.os }}
        uses: pypa/cibuildwheel@bd033a44476646b606efccdd5eed92d5ea1d77ad # v2.20
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
          CIBW_PRERELEASE_PYTHONS: "false"
          CIBW_BUILD_FRONTEND: build
          CIBW_SKIP: ${{ matrix.cibw_skip }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_TEST_REQUIRES: "pytest parameterized"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          CIBW_TEST_SKIP: "*-win_arm64"
        with:
          package-dir: ./

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faster-coco-eval-${{ matrix.os }}-${{ matrix.cibw_archs }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: test_source
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build sdist
        run: make sdist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faster-coco-eval-sdist
          path: ./dist/*.tar.gz

  publish_test:
    needs: [build_wheels, build_sdist]
    name: Publish package to TestPyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  publish_prod:
    needs: [publish_test]
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  docs:
    needs: [publish_prod]
    uses: ./.github/workflows/docs.yml
